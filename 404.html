<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found - Ulisses Alves</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#020406">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,300..600&display=swap" rel="stylesheet">
<style>
:root{--void:#020406;--signal:#2f86ff;--flare:#8fdcff;--steel:#dcd6d5;--slate:#8e9a9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse 60% 60% at 70% 40%,rgba(47,134,255,.16),transparent 70%),var(--void);color:var(--steel);font-family:"Newsreader",Georgia,serif;-webkit-font-smoothing:antialiased}
main{display:grid;gap:18px;justify-items:start;max-width:34rem}
h1{margin:0;position:relative;font-family:"Big Shoulders Display","Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:900;font-size:clamp(7rem,34vw,15rem);line-height:.8;letter-spacing:.01em;
  background:linear-gradient(180deg,#fbfcfc 8%,var(--steel) 44%,#77858c 96%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1::after{content:"";position:absolute;left:-7%;right:-7%;top:47%;height:2px;mix-blend-mode:screen;background:linear-gradient(90deg,transparent,rgba(47,134,255,.7) 18%,var(--flare) 54%,#fff 62%,var(--flare) 70%,rgba(47,134,255,.7) 82%,transparent);box-shadow:0 0 18px 2px rgba(47,134,255,.55),0 0 46px 6px rgba(47,134,255,.25)}
p{margin:0;font-style:italic;font-size:1.25rem;color:var(--slate)}
code{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-style:normal;font-size:.95rem;color:var(--flare);overflow-wrap:anywhere}
a{font-family:"Big Shoulders Display","Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:700;font-size:1.1rem;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);text-underline-offset:6px;text-decoration-color:rgba(143,220,255,.6)}
a:hover{color:var(--flare)}
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>Nothing at this address.</p>
  <code id="where"></code>
  <a href="/">Return to home</a>
</main>
<script>document.getElementById("where").textContent = "$ ls " + location.pathname + "\nNo such file or directory";document.getElementById("where").style.whiteSpace = "pre-wrap";</script>
</body>
</html>
